<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>千言·AI智能助手</title>
<style>
:root{color-scheme:light;--bg:#f6f8fa;--panel:#fff;--side:#edf2f5;--text:#233744;--muted:#7a8b96;--line:#e1e8ed;--accent:#267c91;--user:#e0f0f3;--shadow:0 12px 50px #2642530b}*{box-sizing:border-box}body{margin:0;font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif;color:var(--text);background:var(--bg)}body.dark{color-scheme:dark;--bg:#142026;--panel:#1c2b33;--side:#18262d;--text:#e2ecef;--muted:#91a5af;--line:#30434d;--accent:#75c0ce;--user:#244650;--shadow:0 12px 50px #0002}button,textarea{font:inherit}button{cursor:pointer}button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button{color:inherit}.app{height:100dvh;display:flex}.sidebar{width:272px;flex-shrink:0;background:var(--side);padding:30px 18px 20px;display:flex;flex-direction:column;border-right:1px solid var(--line)}.brand{font-size:18px;font-weight:650;padding:0 10px;letter-spacing:.4px}.mark{display:inline-grid;place-items:center;width:33px;height:33px;border-radius:11px;background:var(--accent);color:var(--panel);margin-right:7px}.tag{font-size:11px;color:var(--muted);letter-spacing:3px;padding:12px 12px 30px}.new{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:13px;text-align:left;box-shadow:var(--shadow)}.new span{float:right;color:var(--accent)}.label{font-size:11px;letter-spacing:2px;color:var(--muted);padding:30px 12px 12px}.sessions{overflow:auto;flex:1}.session{display:flex;align-items:center;border-radius:10px;margin:5px 0}.session.active{background:var(--panel);box-shadow:var(--shadow)}.choose{flex:1;min-width:0;text-align:left;border:0;background:none;padding:14px 12px;font-size:13px}.delete{background:none;border:0;color:var(--muted);font-size:20px;padding:10px}.foot{border-top:1px solid var(--line);padding:18px 8px 0;font-size:11px;color:var(--muted);line-height:1.8}.main{display:flex;flex-direction:column;flex:1;min-width:0}.header{height:80px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 36px}.heading{font-size:14px;font-weight:600}.sub{font-size:11px;color:var(--muted);margin-top:6px}.theme{border:1px solid var(--line);background:var(--panel);border-radius:50%;width:38px;height:38px}.messages{flex:1;overflow:auto;padding:32px max(24px,calc((100% - 860px)/2));scroll-behavior:smooth}.welcome{height:100%;min-height:260px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding-bottom:35px}.welcome .symbol{width:65px;height:65px;border:1px solid var(--line);background:var(--panel);border-radius:21px;display:grid;place-items:center;color:var(--accent);font-size:30px;box-shadow:var(--shadow)}h1{font-size:29px;font-weight:550;letter-spacing:1px;margin:24px 0 12px}.welcome p{font-size:14px;color:var(--muted);line-height:1.9;margin:0}.chips{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin-top:30px}.chip{border:1px solid var(--line);background:var(--panel);padding:11px 15px;border-radius:10px;font-size:12px;color:var(--muted)}.row{display:flex;align-items:flex-start;gap:12px;margin-bottom:26px}.row.user{flex-direction:row-reverse}.avatar{height:34px;width:34px;border-radius:12px;flex-shrink:0}.message{max-width:calc(100% - 60px);min-width:70px}.name{font-size:10px;color:var(--muted);margin:1px 0 8px}.user .name{text-align:right}.bubble{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.8;font-size:14px;padding:15px 19px;border-radius:3px 16px 16px;background:var(--panel);border:1px solid var(--line)}.user .bubble{background:var(--user);border-color:transparent;border-radius:16px 3px 16px 16px}.pending{color:var(--muted)}.meta{font-size:11px;color:var(--muted);padding:7px 2px}.composer-wrap{padding:16px max(24px,calc((100% - 860px)/2)) 22px}.composer{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 15px;box-shadow:var(--shadow)}textarea{display:block;width:100%;height:64px;max-height:180px;resize:vertical;border:0;background:none;color:var(--text);padding:4px;line-height:1.6}textarea:focus{outline:0}textarea::placeholder{color:var(--muted)}.tools{display:flex;align-items:center;justify-content:space-between;margin-top:9px}.hint{color:var(--muted);font-size:11px}.send{border:0;background:var(--accent);color:var(--panel);padding:10px 17px;border-radius:10px;font-size:12px}.note{font-size:10px;text-align:center;color:var(--muted);margin:12px 0 0}.notice{font-size:12px;color:var(--accent);padding:0 0 10px;line-height:1.6}.hidden{display:none}@media(max-width:700px){.sidebar{width:172px;padding:22px 10px}.brand{font-size:13px;padding:0}.mark{display:none}.tag{padding:12px 0 25px;font-size:9px}.header{padding:0 18px;height:68px}.messages{padding:22px 14px}.composer-wrap{padding:10px 12px 14px}h1{font-size:22px}.hint{font-size:9px}.chips{gap:6px}.chip{padding:8px}.bubble{padding:12px}.row{gap:8px}.foot{font-size:10px}}@media(max-width:440px){.sidebar{width:125px}.brand{font-size:11px}.choose{padding:13px 5px;font-size:11px}.delete{padding:6px}.new{font-size:12px}.hint{max-width:110px}.avatar{width:28px;height:28px}.message{max-width:calc(100% - 36px)}}

/* Soft technical accents */
.main{background-image:radial-gradient(ellipse at 80% 0%,#6bbcc512,transparent 50%)}
.header{background:var(--bg)}
.welcome{position:relative;isolation:isolate}
.welcome:before{content:"";position:absolute;z-index:-1;width:min(440px,100%);height:290px;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:32px 32px;mask-image:radial-gradient(ellipse,#0008,transparent 70%);pointer-events:none}
.welcome .symbol{box-shadow:0 0 0 8px #63aeb70a,0 0 45px #63aeb71c}
.composer:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px #69aeba12}
.connection-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#66a99c;box-shadow:0 0 8px #66a99c66;margin-right:6px}
.choose{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
<body><div class="app"><aside class="sidebar"><div class="brand"><span class="mark">千</span>千言·AI智能助手</div><div class="tag">A LITTLE WORD, A NEW WORLD</div><button class="new" id="new">新建聊天 <span>＋</span></button><div class="label">我的会话</div><nav class="sessions" id="sessions" aria-label="会话列表"></nav><div class="foot"><span class="connection-dot"></span> 灵感连接中</div></aside><main class="main"><header class="header"><div><div class="heading" id="heading">新的对话</div><div class="sub" id="status">● 准备就绪，随时开始</div></div><button class="theme" id="theme" aria-label="切换主题">☾</button></header><section class="messages" id="messages" aria-label="聊天消息" aria-live="polite"></section><div class="composer-wrap"><div class="notice hidden" id="notice"></div><div class="composer"><textarea id="input" aria-label="输入消息" placeholder="写下你的问题，或分享一个灵感…"></textarea><div class="tools"><span class="hint">Enter 发送 · Shift + Enter 换行</span><button class="send" id="send">发送消息 ↑</button></div></div><p class="note">AI 生成的内容可能不准确，请核实重要信息。</p></div></main></div>
<script>
'use strict';
// const API='http://localhost:10010/api/streamChat';
const API='http://116.62.82.186:10010/api/streamChat';
// 将 AI_AVATAR 替换为用户提供图片的 data:image/...;base64,... 即可。
function avatar(color,user){const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80"><rect width="80" height="80" rx="24" fill="${color}"/>${user?'<circle cx="40" cy="29" r="12" fill="#fff"/><path d="M18 67c0-25 44-25 44 0" fill="#fff"/>':'<rect x="17" y="23" width="46" height="36" rx="13" fill="#fff"/><path d="M40 15v8" stroke="#fff" stroke-width="4"/><circle cx="31" cy="39" r="3" fill="'+color+'"/><circle cx="49" cy="39" r="3" fill="'+color+'"/><path d="M32 48q8 7 16 0" fill="none" stroke="'+color+'" stroke-width="3"/>'}</svg>`;return 'data:image/svg+xml;base64,'+btoa(svg)}
const AI_AVATAR = './ai.png';
const USER_AVATAR = './user.png';
const $=id=>document.getElementById(id),validId=n=>Number.isInteger(n)&&n>=100000&&n<=999999;
let storageOK=true;
function read(k){try{return localStorage.getItem(k)}catch{storageOK=false;return null}}
function write(k,v){try{localStorage.setItem(k,v)}catch{storageOK=false}}
function randomId(){const a=new Uint32Array(1);crypto.getRandomValues(a);return 100000+a[0]%900000}
let userId=Number(read('qianyan.userId'));if(!validId(userId)){userId=randomId();write('qianyan.userId',String(userId))}
let sessions=[],active=null,current=null;
try{const saved=JSON.parse(read('qianyan.sessions')||'[]');const seen=new Set();if(Array.isArray(saved))sessions=saved.filter(s=>s&&validId(s.id)&&!seen.has(s.id)&&seen.add(s.id)).map(s=>({id:s.id,messages:Array.isArray(s.messages)?s.messages.filter(m=>m&&['user','ai'].includes(m.role)&&typeof m.text==='string').map(m=>({role:m.role,text:m.text,status:m.status==='streaming'?'interrupted':m.status})):[]}))}catch{}
function save(){write('qianyan.sessions',JSON.stringify(sessions));write('qianyan.active',String(active))}
function notice(t){$('notice').textContent=t;$('notice').classList.toggle('hidden',!t)}
function syncBusy(){$('send').textContent=current?'停止生成 ■':'发送消息 ↑';$('status').textContent=current?'● 正在生成回复…':'● 准备就绪，随时开始'}
function cancel(){if(current){const old=current;current=null;old.controller.abort();old.message.status='interrupted';save()}syncBusy()}
function create(){cancel();if(sessions.length>=900000){notice('会话数量已达上限，请先删除会话。');return}const ids=new Set(sessions.map(s=>s.id));let id;do{id=randomId()}while(ids.has(id));sessions.unshift({id,messages:[]});active=id;save();render();$('input').value='';$('input').focus()}
function select(id){if(id===active)return;cancel();active=id;$('input').value='';save();render()}
function remove(id){if(id===active)cancel();sessions=sessions.filter(s=>s.id!==id);if(!sessions.length){create();return}if(active===id)active=sessions[0].id;save();render()}
function sessionTitle(s){const first=s.messages.find(m=>m.role==='user'&&m.text.trim());if(!first)return '新的对话';const text=first.text.trim().replace(/\s+/g,' ');return Array.from(text).slice(0,22).join('')+(Array.from(text).length>22?'…':'')}
function renderList(){$('sessions').replaceChildren();for(const s of sessions){const item=document.createElement('div');item.className='session'+(s.id===active?' active':'');const b=document.createElement('button');b.className='choose';b.textContent=sessionTitle(s);b.title=sessionTitle(s);b.setAttribute('aria-label','打开对话：'+sessionTitle(s));b.onclick=()=>select(s.id);b.setAttribute('aria-current',s.id===active?'true':'false');const d=document.createElement('button');d.className='delete';d.textContent='×';d.setAttribute('aria-label','删除对话：'+sessionTitle(s));d.onclick=()=>remove(s.id);item.append(b,d);$('sessions').append(item)}}
function drawMessage(m){const row=document.createElement('div');row.className='row '+m.role;const img=document.createElement('img');img.className='avatar';img.src=m.role==='ai'?AI_AVATAR:USER_AVATAR;img.alt=m.role==='ai'?'AI 头像':'用户头像';const content=document.createElement('div');content.className='message';const name=document.createElement('div');name.className='name';name.textContent=m.role==='ai'?'千言 QIANYAN':'你';const bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=m.text||(m.status==='streaming'?'思考中…':'暂无回复');if(!m.text)bubble.classList.add('pending');content.append(name,bubble);if(m.status==='interrupted'||m.status==='error'){const meta=document.createElement('div');meta.className='meta';meta.textContent=m.status==='error'?'回复未完成，请检查连接后重试':'已停止生成';content.append(meta)}row.append(img,content);return {row,bubble}}
function render(){renderList();$('heading').textContent=sessionTitle(sessions.find(s=>s.id===active));$('messages').replaceChildren();const s=sessions.find(s=>s.id===active);if(!s.messages.length){const w=document.createElement('div');w.className='welcome';w.innerHTML='<div class="symbol">✧</div><h1>你好，今天想聊些什么？</h1><p>解答疑问，整理思路，捕捉灵感。<br>千言，陪你从一个问题开始。</p><div class="chips"><button class="chip">帮我梳理一个新想法</button><button class="chip">今天重庆的天气怎么样？</button><button class="chip">解释一个复杂概念</button></div>';$('messages').append(w);w.querySelectorAll('button').forEach(b=>b.onclick=()=>{$('input').value=b.textContent;$('input').focus()})}else for(const m of s.messages)$('messages').append(drawMessage(m).row);$('messages').scrollTop=$('messages').scrollHeight;syncBusy()}
// SSE 按完整事件处理，保留跨 chunk 的行和跨行 data 内容。
function sseParser(onData){let buffer='',data=[],done=false;function dispatch(){if(!data.length)return;const value=data.join('\n');data=[];if(value==='[DONE]'){done=true;return}if(!done)onData(value)}function line(s){if(s===''){dispatch();return}if(s.startsWith(':'))return;const i=s.indexOf(':');const field=i<0?s:s.slice(0,i);let value=i<0?'':s.slice(i+1);if(value.startsWith(' '))value=value.slice(1);if(field==='data')data.push(value)}return {push(text,final=false){buffer+=text;let i=0,start=0;while(i<buffer.length){if(buffer[i]==='\r'||buffer[i]==='\n'){if(buffer[i]==='\r'&&i===buffer.length-1&&!final)break;line(buffer.slice(start,i));if(buffer[i]==='\r'&&buffer[i+1]==='\n')i++;start=++i}else i++}buffer=buffer.slice(start);if(final){if(buffer)line(buffer);buffer='';dispatch()}},get done(){return done}}}
async function consumeResponse(response,append,signal){const reader=response.body.getReader(),decoder=new TextDecoder();const type=(response.headers.get('content-type')||'').toLowerCase();let mode=type.includes('text/event-stream')?'sse':null,prefix='';const parser=sseParser(append);function feed(text,final=false){if(mode==='sse'){parser.push(text,final);return}if(mode==='plain'){append(text);return}prefix+=text;if(!prefix&&!final)return;const probe=prefix.replace(/^\uFEFF/,'');if(/^(?:data:|event:|id:|retry:|:)/.test(probe)){mode='sse';parser.push(probe,final);prefix=''}else if(final||probe.includes('\n')||probe.length>12||!['data:','event:','id:','retry:',':'].some(p=>p.startsWith(probe))){mode='plain';append(prefix);prefix=''}}try{while(true){if(signal.aborted)throw new DOMException('Aborted','AbortError');const {value,done}=await reader.read();if(done)break;feed(decoder.decode(value,{stream:true}));if(parser.done){await reader.cancel();break}}feed(decoder.decode(),true)}finally{reader.releaseLock()}}
async function send(){if(current){cancel();render();return}const prompt=$('input').value.trim();if(!prompt)return;notice('');const session=sessions.find(s=>s.id===active);session.messages.push({role:'user',text:prompt});const message={role:'ai',text:'',status:'streaming'};session.messages.push(message);const token={controller:new AbortController(),message,sessionId:session.id};current=token;$('input').value='';save();render();const bubbles=$('messages').querySelectorAll('.bubble');const bubble=bubbles[bubbles.length-1];try{const response=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','Accept':'text/plain'},body:JSON.stringify({sessionId:session.id,userId,prompt}),signal:token.controller.signal});if(!response.ok)throw new Error('HTTP '+response.status);if(!response.body)throw new Error('浏览器无法读取响应流');await consumeResponse(response,text=>{if(current!==token||active!==session.id)return;const nearBottom=$('messages').scrollHeight-$('messages').scrollTop-$('messages').clientHeight<100;message.text+=text;bubble.textContent=message.text;bubble.classList.remove('pending');if(nearBottom)$('messages').scrollTop=$('messages').scrollHeight},token.controller.signal);if(current!==token)return;message.status='done';if(!message.text)message.text='服务端未返回内容。'}catch(error){if(current!==token)return;if(error.name==='AbortError')message.status='interrupted';else{message.status='error';notice('请求失败：'+error.message+'。请确认后端已启动；若页面与接口端口不同，后端需允许该页面来源的 CORS 请求。')}}finally{if(current===token){current=null;save();render()}}}
function setTheme(dark){document.body.classList.toggle('dark',dark);$('theme').textContent=dark?'☀':'☾';$('theme').setAttribute('aria-label',dark?'切换为白天主题':'切换为黑夜主题');write('qianyan.theme',dark?'dark':'light')}
setTheme(read('qianyan.theme')==='dark');$('theme').onclick=()=>setTheme(!document.body.classList.contains('dark'));$('new').onclick=create;$('send').onclick=send;$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();if(!current)send()}});window.addEventListener('beforeunload',()=>{cancel();save()});const previous=Number(read('qianyan.active'));if(sessions.length){active=sessions.some(s=>s.id===previous)?previous:sessions[0].id;render()}else create();if(!storageOK)notice('浏览器禁用了本地存储：当前页面可使用，但用户身份与会话无法在刷新后保留。');
</script>
</body></html>
